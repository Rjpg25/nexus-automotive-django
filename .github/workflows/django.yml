name: Pruebas Django
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Generar clave efímera de pruebas
        run: python -c 'import os,secrets; open(os.environ["GITHUB_ENV"],"a").write("DJANGO_SECRET_KEY="+secrets.token_urlsafe(56)+"\n")'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test nexus --verbosity 2
      - run: python manage.py collectstatic --noinput
