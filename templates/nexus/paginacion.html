{% if pagina.has_other_pages %}<nav class="pagination-bar" aria-label="Páginas"><span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }} · {{ pagina.paginator.count }} registros</span><div>{% if pagina.has_previous %}<a class="btn btn-outline-secondary btn-sm" href="?q={{ q|urlencode }}&amp;estado={{ estado|default:''|urlencode }}&amp;page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}{% if pagina.has_next %}<a class="btn btn-outline-secondary btn-sm" href="?q={{ q|urlencode }}&amp;estado={{ estado|default:''|urlencode }}&amp;page={{ pagina.next_page_number }}">Siguiente →</a>{% endif %}</div></nav>{% endif %}
