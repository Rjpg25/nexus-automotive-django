# Servicio gratuito de demostración. DATABASE_URL debe ser PostgreSQL.
# Selecciona una base existente o créala en Render antes de aplicar el Blueprint.
services:
  - type: web
    name: nexus-automotive-django
    runtime: python
    branch: feat/nexus-administracion
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        sync: false
      - key: NEXUS_ADMIN_USERNAME
        sync: false
      - key: NEXUS_ADMIN_PASSWORD
        sync: false
